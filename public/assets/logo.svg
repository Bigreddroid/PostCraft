<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Dark textured aesthetic) -->
    <radialGradient id="bgGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.6"/>
      <stop offset="60%" stop-color="#09090b" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050508" stop-opacity="1"/>
    </radialGradient>

    <!-- Ribbon Loop Gradient (Cyan to Royal Blue to Electric Violet) -->
    <linearGradient id="ribbonGrad" x1="20%" y1="10%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="35%" stop-color="#3b82f6"/>
      <stop offset="70%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Under-fold Dark Violet Gradient -->
    <linearGradient id="underFoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065"/>
      <stop offset="50%" stop-color="#4c1d95"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Bottom Stem Gradient -->
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7e22ce"/>
      <stop offset="40%" stop-color="#4338ca"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>

    <!-- Fold Specular Highlight -->
    <linearGradient id="highlightGrad" x1="30%" y1="0%" x2="70%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </linearGradient>

    <!-- AI Text Gradient -->
    <linearGradient id="aiTextGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="sparkleGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" rx="40" fill="#0c0e17"/>
  <rect width="600" height="600" rx="40" fill="url(#bgGlow)"/>

  <!-- Logo Mark Group -->
  <g transform="translate(300, 210)">
    <!-- Ambient Glow behind ribbon -->
    <ellipse cx="10" cy="-20" rx="100" ry="70" fill="#6366f1" opacity="0.25" filter="url(#softGlow)"/>

    <!-- Under-fold shadow & bottom stem of P -->
    <path d="M -78, -10 
             L -30, -35
             C -10, -45 50, -45 80, -20
             C 105, 0 95, 45 40, 65
             L -20, 80
             C -55, 90 -85, 60 -80, 20
             Z" 
          fill="url(#underFoldGrad)" opacity="0.8"/>

    <!-- Bottom Left Stem of P with Fold Depth -->
    <path d="M -86, 0 
             C -86, -10 -76, -18 -64, -15
             L -24, -5
             C -14, -2 -8, 6 -8, 16
             L -18, 95
             C -20, 106 -30, 115 -42, 115
             L -62, 115
             C -76, 115 -86, 103 -86, 88
             Z" 
          fill="url(#stemGrad)"/>

    <!-- Inner fold curve highlight -->
    <path d="M -24, -5 
             L -8, 16 
             L -18, 95 
             C -20, 106 -30, 115 -42, 115 
             L -40, 100 
             L -28, 15 
             Z" 
          fill="#000000" opacity="0.35"/>

    <!-- Main Upper 3D Ribbon of P -->
    <path d="M -80, -25
             C -75, -75 -40, -115 20, -120
             C 75, -125 125, -95 130, -35
             C 135, 25 90, 65 30, 75
             L -30, 85
             C -15, 75 10, 65 40, 52
             C 80, 35 105, 5 95, -30
             C 85, -68 50, -88 5, -85
             C -40, -82 -68, -55 -72, -22
             Z" 
          fill="url(#ribbonGrad)" 
          filter="url(#softGlow)"/>

    <!-- Top Gloss Ribbon Highlight -->
    <path d="M -75, -45
             C -50, -95 0, -120 50, -115
             C 100, -110 125, -80 120, -35
             C 112, 10 80, 45 40, 55
             C 65, 35 95, 5 88, -25
             C 80, -55 50, -78 15, -75
             C -30, -72 -60, -45 -75, -45
             Z" 
          fill="url(#highlightGrad)"/>

    <!-- Sparkle Star on Lower Fold Stem -->
    <g transform="translate(-48, 52)" filter="url(#sparkleGlow)">
      <path d="M 0, -14 
               C 0.5, -4 4, -0.5 14, 0 
               C 4, 0.5 0.5, 4 0, 14 
               C -0.5, 4 -4, 0.5 -14, 0 
               C -4, -0.5 -0.5, -4 0, -14 Z" 
            fill="#ffffff"/>
      <circle cx="0" cy="0" r="2.5" fill="#e0e7ff"/>
    </g>

    <!-- 3 Radiant Light Rays / Bursts on Top Right -->
    <g stroke="#7dd3fc" stroke-width="8" stroke-linecap="round" opacity="0.95">
      <!-- Ray 1 (Top angled) -->
      <line x1="145" y1="-85" x2="168" y2="-105" />
      <!-- Ray 2 (Middle horizontal) -->
      <line x1="155" y1="-45" x2="182" y2="-45" />
      <!-- Ray 3 (Bottom angled) -->
      <line x1="145" y1="-5" x2="168" y2="15" />
    </g>
  </g>

  <!-- Typography: PostCraft AI -->
  <g transform="translate(300, 440)" text-anchor="middle">
    <text font-family="'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif" font-weight="800" font-size="62" letter-spacing="-1">
      <tspan fill="#ffffff">PostCraft </tspan>
      <tspan fill="url(#aiTextGrad)">AI</tspan>
    </text>

    <!-- Tagline: IDEAS TO IMPACT EVERYWHERE -->
    <text y="42" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-weight="600" font-size="15" fill="#94a3b8" letter-spacing="6.5">
      IDEAS TO IMPACT EVERYWHERE
    </text>
  </g>
</svg>
