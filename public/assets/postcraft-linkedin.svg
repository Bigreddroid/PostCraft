<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0b14"/>
      <stop offset="50%" stop-color="#0f1123"/>
      <stop offset="100%" stop-color="#18132b"/>
    </linearGradient>

    <linearGradient id="glowIndigo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2e1065" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#09090b" stop-opacity="0.85"/>
    </linearGradient>

    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60"/>
    </filter>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="150" r="280" fill="#4f46e5" opacity="0.25" filter="url(#blurFilter)"/>
  <circle cx="1050" cy="550" r="320" fill="#8b5cf6" opacity="0.22" filter="url(#blurFilter)"/>
  <circle cx="600" cy="350" r="220" fill="#f59e0b" opacity="0.12" filter="url(#blurFilter)"/>

  <!-- Subtle Perspective Grid -->
  <g opacity="0.12" stroke="#6366f1" stroke-width="1">
    <line x1="0" y1="520" x2="1200" y2="520"/>
    <line x1="0" y1="570" x2="1200" y2="570"/>
    <line x1="0" y1="620" x2="1200" y2="620"/>
    <line x1="0" y1="660" x2="1200" y2="660"/>
    <line x1="150" y1="480" x2="0" y2="675"/>
    <line x1="350" y1="480" x2="200" y2="675"/>
    <line x1="600" y1="480" x2="600" y2="675"/>
    <line x1="850" y1="480" x2="1000" y2="675"/>
    <line x1="1050" y1="480" x2="1200" y2="675"/>
  </g>

  <!-- Left Content Column -->
  <g transform="translate(80, 100)">
    <!-- Brand Pill -->
    <rect x="0" y="0" width="220" height="38" rx="19" fill="#1e1b4b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="20" cy="19" r="6" fill="#f59e0b"/>
    <text x="36" y="24" fill="#c7d2fe" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" letter-spacing="1">POSTCRAFT AI STUDIO</text>

    <!-- Main Headline -->
    <text x="0" y="95" fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      One Core Idea.
    </text>
    <text x="0" y="150" fill="url(#accentGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="-0.5">
      3 Viral Formats.
    </text>

    <!-- Description -->
    <text x="0" y="205" fill="#94a3b8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">Instant algorithm-tailored copy and synchronized visuals</tspan>
      <tspan x="0" dy="26">for LinkedIn, Twitter/X, and Instagram.</tspan>
    </text>

    <!-- Feature Badges -->
    <g transform="translate(0, 280)">
      <rect x="0" y="0" width="130" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="20" y="26" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⚡ 3.2s Gen</text>

      <rect x="142" y="0" width="160" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="160" y="26" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="13" font-weight="600">✨ Gemini 2.5</text>

      <rect x="314" y="0" width="140" height="42" rx="12" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="332" y="26" fill="#34d399" font-family="system-ui, sans-serif" font-size="13" font-weight="600">🎯 1-Click ZIP</text>
    </g>
  </g>

  <!-- Right Visual Holographic Stack Cards -->
  <g transform="translate(680, 80)" filter="url(#dropShadow)">
    <!-- Back Card - Instagram (1:1) -->
    <g transform="translate(160, 40) rotate(8)">
      <rect width="260" height="260" rx="20" fill="url(#cardGrad2)" stroke="#ec4899" stroke-width="2" opacity="0.85"/>
      <rect x="20" y="20" width="220" height="140" rx="12" fill="#831843" opacity="0.6"/>
      <circle cx="130" cy="90" r="30" fill="#f43f5e" opacity="0.4"/>
      <path d="M130 75 L145 105 L115 105 Z" fill="#fb7185"/>
      <!-- Instagram Badge -->
      <rect x="20" y="175" width="80" height="22" rx="6" fill="#ec4899"/>
      <text x="32" y="190" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="700">Instagram</text>
      <rect x="20" y="210" width="180" height="8" rx="4" fill="#f472b6" opacity="0.5"/>
      <rect x="20" y="226" width="120" height="8" rx="4" fill="#f472b6" opacity="0.3"/>
    </g>

    <!-- Mid Card - Twitter (16:9) -->
    <g transform="translate(60, 160) rotate(-6)">
      <rect width="320" height="200" rx="18" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="2" opacity="0.95"/>
      <circle cx="35" cy="35" r="14" fill="#0284c7"/>
      <text x="30" y="40" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">𝕏</text>
      <text x="60" y="38" fill="#f1f5f9" font-family="sans-serif" font-size="12" font-weight="bold">Viral Thread Hook</text>
      <rect x="25" y="65" width="270" height="10" rx="5" fill="#38bdf8" opacity="0.7"/>
      <rect x="25" y="85" width="240" height="10" rx="5" fill="#38bdf8" opacity="0.5"/>
      <rect x="25" y="105" width="190" height="10" rx="5" fill="#38bdf8" opacity="0.3"/>
      <!-- Thread Metric -->
      <rect x="25" y="140" width="100" height="32" rx="8" fill="#0369a1" opacity="0.6"/>
      <text x="38" y="161" fill="#e0f2fe" font-family="sans-serif" font-size="11" font-weight="600">🚀 4.2k RTs</text>
    </g>

    <!-- Front Hero Card - LinkedIn (16:9) -->
    <g transform="translate(-20, 240) rotate(0)">
      <rect width="380" height="250" rx="20" fill="#0f172a" stroke="#6366f1" stroke-width="2.5"/>
      <!-- Header -->
      <circle cx="36" cy="38" r="16" fill="#2563eb"/>
      <text x="30" y="43" fill="#ffffff" font-family="sans-serif" font-size="14" font-weight="bold">in</text>
      <text x="64" y="34" fill="#ffffff" font-family="sans-serif" font-size="13" font-weight="bold">Thought Leadership</text>
      <text x="64" y="49" fill="#94a3b8" font-family="sans-serif" font-size="10">Engineered for Executive Reach</text>

      <!-- Headline & Body Mock -->
      <rect x="24" y="75" width="330" height="12" rx="6" fill="#818cf8"/>
      <rect x="24" y="96" width="310" height="9" rx="4.5" fill="#64748b"/>
      <rect x="24" y="112" width="330" height="9" rx="4.5" fill="#64748b"/>
      <rect x="24" y="128" width="260" height="9" rx="4.5" fill="#64748b"/>

      <!-- Visual Mini Box -->
      <rect x="24" y="152" width="332" height="70" rx="10" fill="#1e1b4b" stroke="#4f46e5" stroke-width="1"/>
      <circle cx="60" cy="187" r="18" fill="#6366f1" opacity="0.7"/>
      <path d="M55 187 L62 178 L70 187 L65 195 Z" fill="#fbbf24"/>
      <text x="92" y="183" fill="#c7d2fe" font-family="sans-serif" font-size="11" font-weight="bold">Auto-Generated Visual 16:9</text>
      <text x="92" y="198" fill="#818cf8" font-family="sans-serif" font-size="9">Rendered via Imagen 3 & Gemini 2.5</text>
    </g>
  </g>

  <!-- Bottom Brand Watermark -->
  <g transform="translate(1000, 620)" opacity="0.6">
    <text x="0" y="0" fill="#64748b" font-family="sans-serif" font-size="12" font-weight="500">PostCraft AI Engine</text>
  </g>
</svg>
