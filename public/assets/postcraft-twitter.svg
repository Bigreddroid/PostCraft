<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="twBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070e"/>
      <stop offset="60%" stop-color="#0b0e1a"/>
      <stop offset="100%" stop-color="#14182b"/>
    </linearGradient>

    <!-- Electric Cyan to Purple Gradient -->
    <linearGradient id="twGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="glowOrbs" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <filter id="twBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="80"/>
    </filter>
    <filter id="shadowBox" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#twBg)"/>

  <!-- Ambient Glowing Nebulas -->
  <circle cx="250" cy="180" r="320" fill="#38bdf8" opacity="0.18" filter="url(#twBlur)"/>
  <circle cx="950" cy="480" r="340" fill="#818cf8" opacity="0.22" filter="url(#twBlur)"/>
  <circle cx="600" cy="300" r="200" fill="#a855f7" opacity="0.15" filter="url(#twBlur)"/>

  <!-- Tech Grid Background Pattern -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="350" y1="0" x2="350" y2="675"/>
    <line x1="550" y1="0" x2="550" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="950" y1="0" x2="950" y2="675"/>
    <line x1="1150" y1="0" x2="1150" y2="675"/>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(90, 110)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="36" rx="18" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="18" cy="18" r="5" fill="#38bdf8"/>
    <text x="32" y="23" fill="#e0f2fe" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="1">VIRAL X / TWITTER ENGINE</text>

    <!-- Main Headline -->
    <text x="0" y="90" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      Stop Rewording.
    </text>
    <text x="0" y="145" fill="url(#twGradient)" font-family="system-ui, -apple-system, sans-serif" font-size="46" font-weight="800" letter-spacing="-0.5">
      Start Dominating Feeds.
    </text>

    <!-- Explainer -->
    <text x="0" y="200" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="400">
      <tspan x="0" dy="0">Generate high-conversion hook threads, concise bullet insights,</tspan>
      <tspan x="0" dy="25">and eye-stopping 16:9 visuals in 3 seconds.</tspan>
    </text>

    <!-- Stat Highlights -->
    <g transform="translate(0, 275)">
      <g transform="translate(0, 0)">
        <rect width="135" height="65" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <text x="18" y="28" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">10x</text>
        <text x="18" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">FASTER REACH</text>
      </g>

      <g transform="translate(150, 0)">
        <rect width="135" height="65" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <text x="18" y="28" fill="#818cf8" font-family="system-ui, sans-serif" font-size="20" font-weight="800">260</text>
        <text x="18" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">CHAR PRECISION</text>
      </g>

      <g transform="translate(300, 0)">
        <rect width="135" height="65" rx="14" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
        <text x="18" y="28" fill="#34d399" font-family="system-ui, sans-serif" font-size="20" font-weight="800">100%</text>
        <text x="18" y="48" fill="#64748b" font-family="system-ui, sans-serif" font-size="11" font-weight="600">SYNCED ASSETS</text>
      </g>
    </g>
  </g>

  <!-- Right Viral Tweet Card Visualization -->
  <g transform="translate(710, 100)" filter="url(#shadowBox)">
    <!-- Modern Card Container -->
    <rect width="410" height="475" rx="24" fill="#0b0f19" stroke="#1e293b" stroke-width="2"/>

    <!-- Card Header -->
    <g transform="translate(24, 24)">
      <circle cx="22" cy="22" r="22" fill="#1e293b"/>
      <text x="16" y="28" fill="#38bdf8" font-family="sans-serif" font-size="18" font-weight="bold">𝕏</text>
      <text x="56" y="19" fill="#f8fafc" font-family="system-ui, sans-serif" font-size="15" font-weight="700">PostCraft AI</text>
      <text x="56" y="36" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">@PostCraftHQ · 2m</text>
    </g>

    <!-- Tweet Copy -->
    <g transform="translate(24, 88)">
      <text fill="#f1f5f9" font-family="system-ui, sans-serif" font-size="14" font-weight="600" letter-spacing="-0.2">
        <tspan x="0" dy="0">Writing separate posts for every platform is dead.</tspan>
        <tspan x="0" dy="24">Here is how we turn 1 thought into an entire</tspan>
        <tspan x="0" dy="24" fill="#38bdf8">omnichannel campaign in 3.2 seconds 🧵👇</tspan>
      </text>
    </g>

    <!-- Embedded Visual Preview Card -->
    <g transform="translate(24, 175)">
      <rect width="362" height="195" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Glowing Graph Lines -->
      <path d="M 30 140 Q 90 120, 150 90 T 270 45 T 330 25" fill="none" stroke="#38bdf8" stroke-width="3.5"/>
      <path d="M 30 140 Q 90 120, 150 90 T 270 45 T 330 25 L 330 160 L 30 160 Z" fill="url(#twGradient)" opacity="0.15"/>

      <!-- Node Dots -->
      <circle cx="150" cy="90" r="5" fill="#38bdf8"/>
      <circle cx="270" cy="45" r="5" fill="#818cf8"/>
      <circle cx="330" cy="25" r="7" fill="#c084fc"/>

      <!-- Tag in graphic -->
      <rect x="20" y="20" width="110" height="24" rx="6" fill="#1e293b" opacity="0.9"/>
      <text x="28" y="36" fill="#e2e8f0" font-family="sans-serif" font-size="10" font-weight="700">🚀 VIRAL REACH</text>

      <rect x="220" y="145" width="125" height="30" rx="8" fill="#0284c7"/>
      <text x="235" y="165" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="700">Gemini 2.5 Flash</text>
    </g>

    <!-- Twitter Metrics Bar -->
    <g transform="translate(28, 410)">
      <text x="10" y="20" fill="#64748b" font-family="system-ui, sans-serif" font-size="12">💬 184</text>
      <text x="100" y="20" fill="#34d399" font-family="system-ui, sans-serif" font-size="12">🔁 1.4k</text>
      <text x="195" y="20" fill="#f43f5e" font-family="system-ui, sans-serif" font-size="12">❤️ 8.9k</text>
      <text x="290" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="12">📊 142k</text>
    </g>
  </g>
</svg>
