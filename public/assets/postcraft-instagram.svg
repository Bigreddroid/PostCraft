<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="igBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c071e"/>
      <stop offset="40%" stop-color="#190d38"/>
      <stop offset="80%" stop-color="#2a0845"/>
      <stop offset="100%" stop-color="#100526"/>
    </linearGradient>

    <!-- Instagram Radiant Gradient -->
    <linearGradient id="igGlow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff5470"/>
      <stop offset="40%" stop-color="#d946ef"/>
      <stop offset="80%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <!-- Warm Golden Flame -->
    <linearGradient id="goldFlame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="glassCard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>

    <filter id="deepBlur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="100"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Base Dark Canvas -->
  <rect width="1080" height="1080" fill="url(#igBg)"/>

  <!-- Radiant Atmospheric Light Orbs -->
  <circle cx="200" cy="200" r="380" fill="#ec4899" opacity="0.25" filter="url(#deepBlur)"/>
  <circle cx="880" cy="350" r="420" fill="#8b5cf6" opacity="0.3" filter="url(#deepBlur)"/>
  <circle cx="540" cy="850" r="400" fill="#f59e0b" opacity="0.2" filter="url(#deepBlur)"/>

  <!-- Concentric Aesthetic Rings -->
  <circle cx="540" cy="540" r="440" fill="none" stroke="#d946ef" stroke-width="1.5" opacity="0.15" stroke-dasharray="8 12"/>
  <circle cx="540" cy="540" r="340" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.2"/>
  <circle cx="540" cy="540" r="240" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.25"/>

  <!-- Center Floating Glass Canvas -->
  <g transform="translate(140, 140)" filter="url(#softShadow)">
    <rect width="800" height="800" rx="44" fill="url(#glassCard)" stroke="url(#igGlow)" stroke-width="2.5"/>

    <!-- Header Logo & Tagline -->
    <g transform="translate(60, 60)">
      <!-- Gradient Logo Icon -->
      <rect width="56" height="56" rx="18" fill="url(#igGlow)"/>
      <path d="M 28 14 L 38 34 L 18 34 Z" fill="#ffffff" opacity="0.95"/>
      <circle cx="28" cy="40" r="3" fill="#ffffff"/>

      <text x="74" y="28" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" letter-spacing="0.5">POSTCRAFT AI</text>
      <text x="74" y="48" fill="#f472b6" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="600" letter-spacing="2">OMNICHANNEL STUDIO</text>
    </g>

    <!-- Center Hero Graphics -->
    <g transform="translate(400, 420)">
      <!-- Glowing Floating Crystal Shape -->
      <circle cx="0" cy="-20" r="140" fill="url(#igGlow)" opacity="0.25" filter="url(#deepBlur)"/>
      
      <!-- 3D Diamond / Crystal Quill -->
      <polygon points="0,-130 90,0 0,130 -90,0" fill="url(#igGlow)" opacity="0.9"/>
      <polygon points="0,-130 90,0 0,20" fill="#ffffff" opacity="0.3"/>
      <polygon points="0,-130 0,130 -90,0" fill="#000000" opacity="0.2"/>
      <polygon points="0,20 90,0 0,130" fill="#f43f5e" opacity="0.5"/>

      <!-- Floating Orbiting Sparkles -->
      <circle cx="-130" cy="-60" r="8" fill="#fbbf24"/>
      <circle cx="140" cy="70" r="10" fill="#38bdf8"/>
      <circle cx="110" cy="-90" r="6" fill="#f472b6"/>
      <circle cx="-100" cy="110" r="7" fill="#c084fc"/>
    </g>

    <!-- Bottom Typography & Messaging -->
    <g transform="translate(60, 590)">
      <text fill="#ffffff" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="800" letter-spacing="-0.5">
        <tspan x="0" dy="0">Turn Raw Ideas Into</tspan>
        <tspan x="0" dy="46" fill="url(#igGlow)">Omnichannel Influence.</tspan>
      </text>

      <text x="0" y="110" fill="#cbd5e1" font-family="system-ui, sans-serif" font-size="17" font-weight="400">
        1 Prompt · LinkedIn · Twitter/X · Instagram · 100% Synced
      </text>
    </g>

    <!-- Bottom Action Pill -->
    <g transform="translate(60, 720)">
      <rect width="220" height="42" rx="21" fill="url(#igGlow)"/>
      <text x="32" y="26" fill="#ffffff" font-family="system-ui, sans-serif" font-size="14" font-weight="700">✨ Try Free on Web</text>
    </g>
  </g>
</svg>
